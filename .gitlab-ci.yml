pages:
  image: registry.plmlab.math.cnrs.fr/docker-images/ubuntu/21.10:base
  stage: deploy
  script:
    - apt-get update -qq && apt-get install -y git curl wget && apt-get install -y node-katex && apt-get install -y wget
    - wget https://julialang-s3.julialang.org/bin/linux/x64/1.7/julia-1.7.2-linux-x86_64.tar.gz
    - tar zxvf julia-1.7.2-linux-x86_64.tar.gz
    - cp -r julia-1.7.2 /opt/
    - ln -s /opt/julia-1.7.2/bin/julia /usr/local/bin/julia
    - julia --project -e 'using Pkg; Pkg.activate("."); Pkg.instantiate()'
    - julia --project -e 'using Pkg; pkg"dev PencilArrays"; pkg"dev WriteVTK"'
    - julia --project -e 'using Pkg; import SuperFluids; Pkg.add("Documenter"); Pkg.add("Literate"); Pkg.add("WGLMakie"); Pkg.("JSServe")'
    - julia --project --color=yes docs/make.jl
    - mv docs/build public
  artifacts:
    paths:
      - public
#  only:
#    - master
