stages:
  - test
  - deploy

test:
  image: docker.io/library/ubuntu:26.04
  stage: test
  script:
    - apt-get update -qq && apt-get install -y git curl wget && apt-get install -y libhdf5-openmpi-dev libopenmpi-dev
    - echo "configure git"
    - git config --global --add safe.directory /builds/lmrs/num/SuperFluids.jl
    - echo "download julia 1.12.7"
    - wget https://julialang-s3.julialang.org/bin/linux/x64/1.12/julia-1.12.7-linux-x86_64.tar.gz
    - echo "untar archive"
    - tar zxvf julia-1.12.7-linux-x86_64.tar.gz
    - echo "copy to /opt"
    - cp -r julia-1.12.7 /opt/
    - echo "link to /usr"
    - ln -s /opt/julia-1.12.7/bin/julia /usr/local/bin/julia
    - echo "instantiate dependencies (MPI and HDF5 with system libraries)"
    - julia -e 'ENV["JULIA_MPI_BINARY"]="system"; ENV["JULIA_HDF5_PATH"]="/usr/lib/x86_64-linux-gnu/hdf5/openmpi/"; using Pkg; Pkg.activate("."); Pkg.instantiate(); Pkg.build()'
    - echo "run unit tests"
    - julia --project test/runtests.jl
  only:
    - master
    - merge_requests

pages:
  image: docker.io/library/ubuntu:26.04
  stage: deploy
  script:
    - apt-get update -qq && apt-get install -y git curl wget && apt-get install -y node-katex && apt-get install -y wget libhdf5-openmpi-dev libopenmpi-dev
    - echo "configure git"
    - git config --global --add safe.directory /builds/lmrs/num/SuperFluids.jl
    - echo "download julia 1.12.7"
    - wget https://julialang-s3.julialang.org/bin/linux/x64/1.12/julia-1.12.7-linux-x86_64.tar.gz
    - echo "untar archive"
    - tar zxvf julia-1.12.7-linux-x86_64.tar.gz
    - echo "copy to /opt"
    - cp -r julia-1.12.7 /opt/
    - echo "link to /usr"
    - ln -s /opt/julia-1.12.7/bin/julia /usr/local/bin/julia
    - echo "install dependencies for documentation"
    - julia -e 'using Pkg; Pkg.add("Documenter"); Pkg.add("Literate"); Pkg.add("WGLMakie"); Pkg.add("JSServe"); Pkg.add("CairoMakie")'
    - echo "install dependencies for MPI"
    - julia -e 'using Pkg; Pkg.add("MPI"); Pkg.add("HDF5");'
    - echo "build MPI and HDF5 with system libraries"
    - julia -e 'ENV["JULIA_MPI_BINARY"]="system"; ENV["JULIA_HDF5_PATH"]="/usr/lib/x86_64-linux-gnu/hdf5/openmpi/"; using Pkg; Pkg.add("MPI"); Pkg.build("MPI"; verbose=true); using MPI; Pkg.add("HDF5");  Pkg.build("HDF5"; verbose=true)'
    - echo "activate and instantiate"
    - julia --project -e 'ENV["JULIA_MPI_BINARY"]="system"; ENV["JULIA_HDF5_PATH"]="/usr"; using Pkg; Pkg.activate("."); Pkg.instantiate()'
    - echo "build documentation"
    - julia --project --color=yes docs/make.jl
    - echo "clean directory"
    - rm -rv docs/build/generated/res-* docs/build/generated/GPS.pvd
    - echo "move to public website"
    - mv docs/build public
  artifacts:
    paths:
      - public
  only:
    - master
