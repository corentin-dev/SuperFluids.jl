stages:
  - build
  - test
  - deploy

variables:
  # CI image: built by the build-image job, tagged per commit. The image bakes
  # in Julia 1.12.7, the project dependencies (precompiled) and the doc stack,
  # so the jobs below only pay for a fast Pkg.instantiate() against the warm
  # ~/.julia cache instead of ~10 minutes of setup.
  CI_IMAGE: $CI_REGISTRY_IMAGE/ci

# Builds (or re-tags) the CI image with buildah (daemonless, no docker-in-
# docker: a regular pod can build and push with chroot isolation).
# A full build only happens when Dockerfile/Project.toml/Manifest.toml
# change (content hash); otherwise the existing image is re-tagged for this
# commit (pull + tag + push, a few seconds). The other jobs always reference
# $CI_IMAGE:sha-$CI_COMMIT_SHORT_SHA. Manual (opt-in) in merge requests.
build-image:
  stage: build
  image: docker.io/library/ubuntu:26.04
  variables:
    # chroot isolation: no user namespaces / no privileges needed (rootful).
    BUILDAH_ISOLATION: chroot
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
    - when: on_success
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git buildah skopeo && rm -rf /var/lib/apt/lists/*
    # Git refuses operations on checkouts it does not "own" (recent git);
    # needed before the git ls-tree hash computation below.
    - git config --global --add safe.directory "$(pwd)"
    - export TAG="sha-$CI_COMMIT_SHORT_SHA"
    - export FILEHASH=$(git ls-tree HEAD -- Dockerfile Project.toml Manifest.toml test/Project.toml | awk '{print $3}' | sha256sum | cut -d" " -f1)
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      # Storage driver fallback: overlay cannot always be used inside a k8s
      # pod (overlay-on-overlay or no mount permission) -> fall back to vfs.
      if ! buildah images >/dev/null 2>&1; then
        printf '[storage]\ndriver = "vfs"\n' > /etc/containers/storage.conf
      fi
      if skopeo inspect "docker://$CI_IMAGE:sha-$FILEHASH" >/dev/null 2>&1; then
        echo "CI image inputs unchanged -> re-tag the existing image"
        buildah pull "$CI_IMAGE:sha-$FILEHASH"
        buildah tag  "$CI_IMAGE:sha-$FILEHASH" "$CI_IMAGE:$TAG"
        buildah push "$CI_IMAGE:$TAG"
      else
        echo "Building the CI image (Dockerfile/Project/Manifest changed)"
        buildah bud -t "$CI_IMAGE:sha-$FILEHASH" -t "$CI_IMAGE:$TAG" .
        buildah push "$CI_IMAGE:sha-$FILEHASH"
        buildah push "$CI_IMAGE:$TAG"
      fi

test:
  image: $CI_REGISTRY_IMAGE/ci:sha-$CI_COMMIT_SHORT_SHA
  stage: test
  needs: [build-image]
  before_script:
    # Git refuses operations on checkouts it does not "own" (recent git);
    # $(pwd) keeps this namespace-independent.
    - git config --global --add safe.directory "$(pwd)"
  script:
    # Deps are already installed + precompiled in the image; this only
    # re-creates the environment record from the committed Manifests.
    - julia -e 'using Pkg; Pkg.activate("."); Pkg.instantiate()'
    - julia -e 'using Pkg; Pkg.activate("test"); Pkg.instantiate()'
    - julia --project test/runtests.jl
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pages:
  image: $CI_REGISTRY_IMAGE/ci:sha-$CI_COMMIT_SHORT_SHA
  stage: deploy
  needs: [build-image]
  before_script:
    - git config --global --add safe.directory "$(pwd)"
  script:
    # Documentation stack (already cached/precompiled in the image).
    - julia -e 'using Pkg; Pkg.activate("."); Pkg.instantiate(); Pkg.add(["Documenter","Literate","WGLMakie","JSServe","CairoMakie"])'
    - julia --project --color=yes docs/make.jl
    - echo "clean directory"
    - rm -rv docs/build/generated/res-* docs/build/generated/GPS.pvd
    - echo "move to public website"
    - mv docs/build public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
