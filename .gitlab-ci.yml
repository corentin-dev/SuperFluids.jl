pages:
  image: registry.plmlab.math.cnrs.fr/docker-images/ubuntu/21.10:base
  stage: deploy
  script:
    - apt-get update -qq && apt-get install -y git curl wget && apt-get install -y node-katex && apt-get install -y wget libhdf5-openmpi-dev
    - echo "download julia 1.7.2"
    - wget https://julialang-s3.julialang.org/bin/linux/x64/1.7/julia-1.7.2-linux-x86_64.tar.gz
    - echo "untar archive"
    - tar zxvf julia-1.7.2-linux-x86_64.tar.gz
    - echo "copy to /opt"
    - cp -r julia-1.7.2 /opt/
    - echo "link to /usr"
    - ln -s /opt/julia-1.7.2/bin/julia /usr/local/bin/julia
    - echo "install dependencies for documentation"
    - julia -e 'using Pkg; Pkg.add("Documenter"); Pkg.add("Literate"); Pkg.add("WGLMakie"); Pkg.add("JSServe");'
    - echo "install dependencies for MPI"
    - julia -e 'using Pkg; Pkg.add("MPI"); Pkg.add("HDF5");'
    - echo "build MPI and HDF5 with system libraries"
    - julia -e 'ENV["JULIA_MPI_BINARY"]="system"; ENV["JULIA_HDF5_PATH"]="/usr/lib/x86_64-linux-gnu/hdf5/openmpi/"; using Pkg; Pkg.add("MPI"); Pkg.build("MPI"; verbose=true); using MPI; Pkg.add("HDF5");  Pkg.build("HDF5"; verbose=true)'
    - echo "activate and instantiate"
    - julia --project -e 'ENV["JULIA_MPI_BINARY"]="system"; ENV["JULIA_HDF5_PATH"]="/usr"; using Pkg; Pkg.activate("."); Pkg.instantiate()'
    - echo "build documentation"
    - julia --project --color=yes docs/make.jl
    - echo "move to public website"
    - mv docs/build public
  artifacts:
    paths:
      - public
