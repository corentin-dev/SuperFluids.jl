pages:
  image: registry.plmlab.math.cnrs.fr/docker-images/ubuntu/20.04:base
  stage: deploy
  script:
    - apt-get update -qq && apt-get install -y git && apt-get install -y julia
    - julia --project -e 'using Pkg; Pkg.activate("."); Pkg.instantiate()'
    - julia --project -e 'using Pkg; import SuperFluids; Pkg.add("Documenter")'
    - julia --project --color=yes docs/make.jl
    - mv docs/build public
  artifacts:
    paths:
      - public
#  only:
#    - master
